version: "3.8"

services:
  backend:
    build:
      context: ..
      dockerfile: member4/docker/Dockerfile
    container_name: sarcastone_backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - MEMBER1_DEVICE=cpu
    volumes:
      - ../member4/backend/logs:/app/member4/backend/logs
      - ../datasets:/app/datasets
    restart: unless-stopped
    networks:
      - sarcastone_net

  frontend:
    build:
      context: ..
      dockerfile: member4/docker/Dockerfile.frontend
    container_name: sarcastone_frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - sarcastone_net

networks:
  sarcastone_net:
    driver: bridge
